[project]
name = "launchd-audit"
version = "0.3.0"
description = "MCP server: audit launchd jobs, cron entries, and brew services on macOS — plain-English schedules, health checks, safe actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "macos", "launchd", "cron", "homebrew", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/aka-kika/launchd-audit"
Repository = "https://github.com/aka-kika/launchd-audit"
Issues = "https://github.com/aka-kika/launchd-audit/issues"
Changelog = "https://github.com/aka-kika/launchd-audit/blob/main/CHANGELOG.md"

[project.scripts]
launchd-audit = "launchd_audit.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchd_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
