[project]
name = "launchd-audit"
version = "0.2.0"
description = "MCP server: audit launchd jobs, cron entries, and brew services on macOS — plain-English schedules, health checks, safe actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
launchd-audit = "launchd_audit.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchd_audit"]
